name: bootstrap
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bootstrap.py
      - name: Commit all files
        run: |
          # GITHUB_TOKEN cannot push workflow files; those are added via web UI
          rm -f .github/workflows/scan.yml .github/workflows/digest.yml
          git config user.name "media-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "il-media-tracker: full tool (sources, pipeline, dashboard, workflows)"
          git push
      - name: Remove bootstrap files
        run: |
          git config user.name "media-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q bootstrap.py .github/workflows/bootstrap.yml
          git commit -m "bootstrap done - self cleanup"
          git push
