# מטרות מעקב - כאן מגדירים אחרי מה לעקוב.
# weight: משקל המטרה (1-5). ככל שגבוה יותר, התראות עליה חשובות יותר.
# keywords: כל המילים/צירופים שמפעילים את המטרה (עברית ואנגלית).
# groups: שיוך לוגי (למשל: איראן, טכנולוגיה) לצורך קיבוץ בסיכומים.
# כדי להוסיף מטרה חדשה - מעתיקים בלוק ומשנים. זה הכל.
targets:
  - id: iran
    display: איראן
    weight: 3
    groups: [איראן]
    keywords:
      - איראן
      - אירני
      - טהרן
      - המשמרות המהפכתנים
      - iran
      - tehran
  - id: ai
    display: בינה מלאכותית
    weight: 2
    groups: [טכנולוגיה]
    keywords:
      - בינה מלאכותית
      - קלוד
      - Claude
      - Anthropic
      - אנתרופיק
      - OpenAI
      - ChatGPT
      - צ'אט GPT

