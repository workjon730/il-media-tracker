# מקורות המידע. weight = משקל המקור (1-5): ככל שהמקור משפיע יותר, משקלו גבוה יותר.
# lean = נטייה פוליטית משוערת (left/center/right) בספקטרום הישראלי - שיוך ידני של
# בעל הריפו (כמו בכלי המקורי), לצורך ניתוח איזון בדשבורד ובסיכומים.
# סוגי מקורות:
#   rss      - פיד RSS ישיר של אתר חדשות
#   homepage - סריקת דף הבית עם דירוג בולטות לפי מיקום בעמוד (הגישה של הכלי המקורי)
#   gnews    - חיפוש Google News בעברית לפי מטרה (מכסה את כל האתרים, גם חוסמי סריקה)
#   telegram - ערוץ טלגרם ציבורי (נסרק דרך עמוד ה-web הציבורי t.me/s)
sources:
  - name: ynet
    display: ynet
    type: rss
    url: https://www.ynet.co.il/Integration/StoryRss2.xml
    weight: 5
    lean: left
    enabled: true
  - name: walla
    display: וואלה
    type: rss
    url: https://rss.walla.co.il/feed/1
    weight: 4
    lean: left
    enabled: true
  - name: globes
    display: גלובס
    type: rss
    url: https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=1725
    weight: 3
    lean: center
    econ: true
    enabled: true
  - name: themarker
    display: TheMarker
    type: rss
    url: https://www.themarker.com/srv/tm-all-articles
    weight: 3
    lean: left
    econ: true
    enabled: true
  - name: ice
    display: אייס
    type: rss
    url: https://www.ice.co.il/rss
    weight: 2
    lean: center
    enabled: true
  - name: maariv
    display: מעריב
    type: rss
    url: https://www.maariv.co.il/rss/rssfeed
    weight: 3
    lean: center
    enabled: true
  - name: i24
    display: i24NEWS (אנגלית)
    type: rss
    url: https://www.i24news.tv/en/rss
    weight: 2
    lean: center
    enabled: true
  - name: haaretz
    display: הארץ
    type: homepage       # אין RSS פעיל - סריקת דף בית עם דירוג בולטות
    url: https://www.haaretz.co.il
    weight: 4
    lean: left
    enabled: true
  - name: n12
    display: N12
    type: homepage       # mako.co.il מפנה לדומיין n12 החדש
    url: https://www.mako.co.il/news
    weight: 5
    lean: left
    enabled: true
  - name: gnews
    display: Google News (כל האתרים)
    type: gnews          # נסרק אוטומטית לכל מטרה ב-targets.yaml
    weight: 3
    enabled: true
  - name: amitsegal
    display: עמית סגל (טלגרם)
    type: telegram
    url: https://t.me/s/amitsegal
    weight: 5
    enabled: true

